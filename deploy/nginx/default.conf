# The checkout is mounted as the web root, so everything that is not the site
# itself (the repository, this folder, the README) must answer 404.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

server {
    listen 80;
    server_name www.govzalabs.ru;
    return 301 https://govzalabs.ru$request_uri;
}

server {
    listen 80 default_server;
    server_name govzalabs.ru;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at nginx-proxy, so a redirect built from this server's own
    # scheme and port (/azkar -> /azkar/) would point at http://.
    absolute_redirect off;

    error_page 404 /404.html;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ^~ /deploy/ {
        return 404;
    }

    location = /README.md {
        return 404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # No file name carries a version, so assets are cached briefly.
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600";
    }
}
